<html>

<head>
    <script type="text/javascript">
        function okno_zamknij() {
            window.close()
        }
        function show_alert() {
            alert("Uwaga! To jest alert box!"); 
        }
    </script>
    <style>
        body {
            background-color: gray;
        }
        input {
            background-color: rgb(80, 80, 80);
            border-radius: 7px;
        }
    </style>
</head>

<body>
    <b>Zastosowanie:</b><br>
    Jest używany do przekazywania informacji użytkownikowi.<br>
    Użytkownik musi nacisnąć ok. aby potwierdził jej przeczytanie.<br>
    <input type="button" onclick="show_alert()" value="Pokaż Alert Box" />
    <input type="button" value="zamknij okno" onclick="okno_zamknij()" />
</body>

</html>
