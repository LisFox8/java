<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styl.css">
</head>
<body>
<script type="text/javascript">
function pole_rutkowski()
{
var a_rut= parseFloat(document.getElementById('dlugosc').value);
var b_rut= a_rut*a_rut;
document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_rut.toFixed(2)+" cm^2";
}
function obwod_rutkowski()
{
var a_rut= parseFloat(document.getElementById('dlugosc').value);
var b_rut= 4*a_rut;
document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_rut.toFixed(2)+" cm";
}
</script>
<h1>Wszystko o KWADRACIE</h1><br><br>
Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br>
<input type="button" name="pole" value="Oblicz pole" Onclick="pole_rutkowski()"><br><br>
<input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_rutkowski()"><br><br>
<div style="color:red;font-size:50px;"id="nazwa"></div>
</body>
</html>
