<html>
<head>
<title>
oblicznanie pola i obwodu prostokąta
</title>
<script language="JavaScript">
function pole_rut(a_rut,b_rut)
{
a_liczba=parseFloat(a_rut)
b_liczba=parseFloat(b_rut)
pole_wynik=a_liczba*b_liczba
document.getElementsByName('wyprowadz_pole_rut')[0].value=pole_wynik.toFixed(2);
alert("pole="+pole_wynik.toFixed(2)+" cm^2");
pokaz1.innerHTML="pole="+pole_wynik.toFixed(2)+" cm^2"+"<br>";

}
function obwod_rut(a_rut,b_rut)
{
a_liczba=parseFloat(a_rut)
b_liczba=parseFloat(b_rut)
obwod_wynik=2*a_liczba+2*b_liczba
document.getElementsByName('wyprowadz_obwod_rut')[0].value=obwod_wynik.toFixed(2);
alert("obwod="+obwod_wynik.toFixed(2)+" cm");
pokaz2.innerHTML="obwod="+obwod_wynik.toFixed(2)+"cm";
}
</script>
</head>
<body>
Pobliczanie pola i obwodu prostokąta
<br> <br>
<form name="formularz" action="..." onsubmit="pole_rut(this.a.value,this.b.value);
obwod_rut(this.a.value,this.b.value);return false">
Podaj a=
<input size="6" name="a">
Podaj b=
<input size="6" name="b">
<br> <br>
<input TYPE="submit" Value="oblicz" >
<br> <br>
pole=
<input size="6" name="wyprowadz_pole_rut">
obwod=
<input size="6" name="wyprowadz_obwod_rut">
</form>
<table>
<tr id="pokaz1"></tr>
<tr id="pokaz2"></tr>
</table>
</body>
</html>
