<h1>1. Rodzaje "filozofii" programowania.</h1>
<p>1) Programowanie strukturalne<br>2) Programowanie obiektowe</p>  

<h1>2. Opisz paradygmat programowania strukturalnego. Założenia programowania strukturalnego.</h1>
<p><b>Programowanie strukturalne</b> – paradygmat programowania opierający się na podziale kodu źródłowego programu na procedury i hierarchicznie ułożone bloki z wykorzystaniem struktur kontrolnych w postaci instrukcji wyboru i pętli.</p>
<p><b>Założenia:</b><br>
1. Podzielone bloki kodu mają jeden punkt wejścia (mogą mieć wiele punktów wyjścia).<br>
2. Wykonywanie wyrażeń w określonej kolejności.<br>
3. Używanie instrukcji warunkowych (if, if else).<br>
4. Używanie pętli (for, while, do while).<br>
5. Unikanie instrukcji skoku (goto).<br>
6. Unikanie instrukcji break, continue.<br>
7. Funkcje i zmienne opisujące dany przedmiot nie są ze sobą powiązane.</p>

<h1>3. Programowanie obiektowe: definicja (angielski skrót, obiekty, stan, zachowanie, końcowa konkluzja).</h1>
<p><b>Programowanie obiektowe (ang. OOP – Object-Oriented Programming)</b> – sposób programowania, w którym programy definiuje się za pomocą:<br>
- <b>obiektów</b> (powoływanych do życia wirtualnego i kasowanych przez programistę),<br>
- <b>stanu</b> (danych obiektu nazywanych polami/właściwościami),<br>
- <b>zachowania</b> (procedur obiektu nazywanych metodami).<br>
<b>Konkluzja:</b> Obiektowy program komputerowy wyrażony jest jako zbiór takich obiektów, komunikujących się pomiędzy sobą w celu wykonywania zadań.</p>

<h1>4. Dlaczego stosujemy programowanie obiektowe?</h1>
<p>- Jest to podejście bardziej naturalne dla ludzi (odwzorowanie rzeczywistości w programie).<br>
- Pozwala na lepsze gospodarowanie pamięcią komputera (usuwanie zbędnych obiektów zwalnia pamięć).<br>
- Dobrze napisana i przetestowana klasa może być wielokrotnie wykorzystywana przez innych programistów (oszczędność czasu i pieniędzy).<br>
- Łączy dane (pola) i funkcje (metody) w jednym miejscu (klasie).</p>

<h1>5. Omów następujące pojęcia (w krótkiej formie):</h1>
<p>
<b>• Klasa (class)</b> – rodzaj foremki/szablonu, który opisuje jak będą wyglądać tworzone na jej podstawie obiekty (zawiera definicję pól i metod).<br>
<b>• Obiekt (object)</b> – instancja (byt, twór) powstała na podstawie klasy, posiadająca właściwości (pola) i metody.<br>
<b>• Właściwość (property)</b> – własność/cecha obiektu, np. kolor, marka.<br>
<b>• Metoda (method)</b> – zdolność (czynność), którą umie wykonywać obiekt (funkcja wewnątrz obiektu).<br>
<b>• Konstruktor (constructor)</b> – metoda wywoływana automatycznie w momencie inicjalizacji (tworzenia) obiektu, nadająca mu wartości początkowe.<br>
<b>• Dziedziczenie (inheritance)</b> – mechanizm pozwalający klasie pobierać właściwości i metody od innej klasy („rodzica”) oraz dopisywać własne.<br>
<b>• Hermetyzacja / enkapsulacja (encapsulation)</b> – ukrywanie części pól i metod wewnątrz klasy przed światem zewnętrznym.<br>
<b>• Polimorfizm (polymorphism)</b> – wielopostaciowość; obiekt może zmieniać swoje zachowanie w zależności od potrzeb (np. wywołanie metody z różną liczbą parametrów).
</p>
